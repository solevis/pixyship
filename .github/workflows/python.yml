name: Python 3.13

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # database of the Postgres tests (postgres_app fixture)
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pixyship
          POSTGRES_DB: pixyship_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: ./backend
        run: uv sync
      - name: Lint
        working-directory: ./backend
        run: uv run ruff check
      - name: Format
        working-directory: ./backend
        run: uv run ruff format --check
      - name: Test
        working-directory: ./backend
        env:
          REQUIRE_POSTGRES_TESTS: "1"
        run: uv run pytest
      - name: Type Check
        working-directory: ./backend
        run: uv run ty check
